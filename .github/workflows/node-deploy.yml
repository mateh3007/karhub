name: node-js-test CD

on:
  push:
    branches: [main]
    paths:
      - 'node-js-test/**'
      - '.github/workflows/node-deploy.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: node-js-test

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: node-js-test
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/node-js-test:latest
            ghcr.io/${{ github.repository }}/node-js-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not configured for this repo on purpose — no production database or
      # hosting target is connected. Once PROD_DATABASE_URL is set as a repo
      # secret, this applies pending migrations before the new image goes live.
      - name: Run database migrations
        if: ${{ secrets.PROD_DATABASE_URL != '' }}
        working-directory: node-js-test
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy

      # Works with any host that redeploys on a webhook ping (Render, Railway,
      # Fly.io, a self-hosted watchtower, ...). Set DEPLOY_HOOK_URL as a repo
      # secret to point this at a real target; until then, the step is a no-op.
      - name: Trigger deploy hook
        if: ${{ secrets.DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

      - name: Deploy not configured
        if: ${{ secrets.PROD_DATABASE_URL == '' && secrets.DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Image published to ghcr.io/${{ github.repository }}/node-js-test:${{ github.sha }}."
          echo "No PROD_DATABASE_URL / DEPLOY_HOOK_URL secret is configured, so no live environment was touched."
