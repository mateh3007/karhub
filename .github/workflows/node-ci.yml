name: node-js-test CI

on:
  push:
    branches: ['**']
    paths:
      - 'node-js-test/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'node-js-test/**'
      - '.github/workflows/node-ci.yml'

defaults:
  run:
    working-directory: node-js-test

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karhub
          POSTGRES_PASSWORD: karhub
          POSTGRES_DB: karhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://karhub:karhub@localhost:5432/karhub?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node-js-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e
