services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karhub
      POSTGRES_PASSWORD: karhub
      POSTGRES_DB: karhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies pending Prisma migrations, then exits. Uses the Dockerfile's
  # `build` stage (not `production`) because that's the one with the `prisma`
  # CLI installed — `production` only has the runtime client (see ADR 0013:
  # migrations are a distinct step, never baked into the running container).
  node-migrate:
    build:
      context: ./node-js-test
      target: build
    environment:
      DATABASE_URL: postgresql://karhub:karhub@postgres:5432/karhub?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  node-backend:
    build:
      context: ./node-js-test
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://karhub:karhub@postgres:5432/karhub?schema=public
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 1d
      REDIS_URL: redis://redis:6379
      RESTOCK_PRIORITIES_CACHE_TTL_SECONDS: "30"
      THROTTLE_TTL_MS: "60000"
      THROTTLE_LIMIT: "100"
      # The browser (not this container) calls the API, so this must be the
      # origin the frontend is reachable at from the host, not a service name.
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      node-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Same reasoning as CORS_ORIGIN above: this is inlined into what the
      # browser fetches against, so it must be the host-reachable URL.
      VITE_API_URL: http://localhost:3000
    depends_on:
      - node-backend

  # Not implemented yet (see golang-test/README or the root README) — this
  # service only builds/runs when explicitly requested:
  #   docker compose --profile golang up
  golang-backend:
    build:
      context: ./golang-test
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://karhub:karhub@postgres:5432/karhub?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - golang

volumes:
  postgres_data:
  redis_data:
